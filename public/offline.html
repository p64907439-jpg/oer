<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · OER</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #171717;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 32px;
        max-width: 24rem;
        margin: 16px;
        text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
      }
      .mark {
        display: inline-flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fff;
        border-radius: 12px;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 16px 0 0;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 14px;
        color: #525252;
        line-height: 1.6;
        margin: 8px 0 0;
      }
      button {
        margin-top: 20px;
        background: #171717;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">O</span>
      <h1>You&apos;re offline</h1>
      <p>
        This page isn&apos;t available without a connection. Reconnect and try
        again — downloaded materials are still on your device.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
